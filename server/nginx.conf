server {
    listen 80;
    server_name jsonservercharacters.marquesjulian.fr;
    return 301 https://$host$request_uri;  # Redirige HTTP vers HTTPS
}

server {
    listen 443 ssl;
    server_name jsonservercharacters.marquesjulian.fr;

    ssl_certificate /etc/letsencrypt/live/jsonservercharacters.marquesjulian.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsonservercharacters.marquesjulian.fr/privkey.pem;

    location / {
        proxy_pass http://json-server:3234;  # Utilise le nom du service Docker
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
