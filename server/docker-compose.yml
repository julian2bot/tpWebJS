version: "3.8"

services:
  json-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3234:3234"  # Expose en local mais pas nécessaire pour le proxy
    networks:
      - mynetwork

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "8080:80"
    depends_on:
      - json-server
    networks:
      - mynetwork

  json-proxy:  # Ajout du service Nginx
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8001:80"
      - "443:443"
    depends_on:
      - json-server
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
