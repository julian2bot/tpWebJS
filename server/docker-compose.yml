version: '3.7'

services:
  # Le service JSON Server
  jsonserver:
    image: jsonserver:latest
    container_name: jsonserver
    volumes:
      - ./db.json:/data/db.json
    ports:
      - "3234:3234"  # Port pour accéder localement en HTTP
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jsonserver.rule=Host(`sae-projet-jsonserverv-vvr3q3-1b215e-77-37-120-142.traefik.me`)"
      - "traefik.http.routers.jsonserver.entrypoints=websecure"
      - "traefik.http.routers.jsonserver.tls=true"
      - "traefik.http.routers.jsonserver.tls.certresolver=http"
      - "traefik.http.services.jsonserver.loadbalancer.server.port=3234"

  # Traefik
  traefik:
    image: traefik:v2.5
    container_name: traefik
    command:
      - "--api.insecure=true"  # Interface Traefik Dashboard (pour la gestion)
      - "--entryPoints.web.address=:80"  # HTTP
      - "--entryPoints.websecure.address=:443"  # HTTPS
      - "--certificatesResolvers.http.acme.email=ton-email@example.com"  # Ton email pour Let's Encrypt
      - "--certificatesResolvers.http.acme.storage=/letsencrypt/acme.json"
      - "--certificatesResolvers.http.acme.httpChallenge.entryPoint=web"  # Utilisation du challenge HTTP pour Let's Encrypt
    ports:
      - "80:80"   # Port HTTP
      - "443:443" # Port HTTPS
      - "8080:8080"  # Traefik Dashboard
    volumes:
      - "./letsencrypt:/letsencrypt"  # Stockage des certificats SSL générés par Let's Encrypt
      - "/var/run/docker.sock:/var/run/docker.sock"  # Accès à l'API Docker pour gérer les containers
    networks:
      - web

networks:
  web:
    external: true

