<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP Compléments Web</title>
    <link rel="stylesheet" href="assets/style/style.css">

    <link rel="stylesheet" href="assets/style/detail.css">
    <link rel="stylesheet" href="assets/style/favoris.css">
    <link rel="stylesheet" href="assets/style/listing.css">
    <link rel="stylesheet" href="assets/style/login.css">
    <script type="module" src="assets/script/app.js"></script>
    
</head>
<body>
    <header>
        <h1>TP WEB</h1>
        <nav>
            <a href="#/listing">Voir la liste</a>
            <a id="creation-link" href="#/detail">Création</a>
            <a href="#/favoris">Favoris</a>
            <a id="login-link" href="#/login">Login / Sign in</a>
        </nav>
        <div id="nameUser">Deco</div>
    </header>
    <svg style="display:none;">
        <filter id="squiggly-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="5" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
        </filter>
    </svg>
    
    <svg style="display:none;">
        <filter id="squiggly-filterHover">
            <feTurbulence type="fractalNoise" baseFrequency="0.046" numOctaves="5" result="noise"></feTurbulence>           
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" />


        </filter>
    </svg>
    
    
    <main id="app">
        <p>Rien a voir ici</p>
    </main>
</body>
<script type="module">
    import UserManagement from './assets/script/utils/UserManagement.js';
    
    let link = document.getElementById("login-link");
    let link_create = document.getElementById("creation-link");
    let textUserCo = document.getElementById("nameUser");
    if(UserManagement.isConnected()){
        link.textContent = "Sign out";
        textUserCo.textContent ="User : "+UserManagement.getUsername();
        link_create.style.display = "initial";
    }else{
        textUserCo.textContent ="";
        link_create.style.display = "none";
    }
</script>
</html>
